services:
  frontend:
    build: ./routine-scheduler-frontend
    container_name: routine-scheduler-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./routine-scheduler-frontend:/app
      - /app/node_modules
    # networks:
    #   - app-network

  backend:
    build: ./routine-scheduler-backend
    container_name: routine-scheduler-backend
    ports:
      - "4200:4200"
    # CONNECTION_URL in .env points at the Neon Postgres database
    env_file:
      - ./.env
    volumes:
      - ./routine-scheduler-backend:/app
      - /app/node_modules
    # networks:
    #   - app-network

# networks:
#   app-network:
#     driver: bridge
